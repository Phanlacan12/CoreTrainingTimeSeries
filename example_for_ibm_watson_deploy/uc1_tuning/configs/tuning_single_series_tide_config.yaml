# Darts 0.36.0 reference:
# - model_name must stay as darts.models.TiDEModel
# - This file keeps only YAML-serializable parameters in the active tuning
#   section. Python-object kwargs remain commented below.
#
# Advanced kwargs supported by Darts but not tuned directly by the current
# TuningConfig schema:
# loss_fn:
# likelihood:
# torch_metrics:
# optimizer_cls:
# optimizer_kwargs:
#   lr: 0.001
# lr_scheduler_cls:
# lr_scheduler_kwargs:
# model_name:
# work_dir:
# log_tensorboard: false
# nr_epochs_val_period: 1
# force_reset: false
# save_checkpoints: false
# add_encoders:
# pl_trainer_kwargs:
#   accelerator: cpu
# show_warnings: false
mlflow:
  enabled: true
  experiment_name: tuning_vdbtn1

data_module_config: &base_loader
  pipeline_type: static_grouped
  loader: grouped_loader
  file_path: example_for_ibm_watson_deploy/uc5_tuning/data/optimize_training_vdbtn_66da6fbe_20260409_175034_202604100851.csv
  time_col: timestamp
  group_col: series_id
  parse_dates: true
  target_columns:
    - target
  covariate:
    past: []
    future:
      - month_cov
    static:
      - TenDiaBan
      - LoaiBenh
      - HeCoQuanLienQuan
      - TenBenh
  backend: pandas
  normalize:
    method: minmax
  split_mode: threshold
  split_threshold:
    train:
      - '20251231'
      - '20260307'
    test:
      - '20260307'
      - '20260307'
  data_freq: D
  return_type: pandas

model:
  single_model:
    model_name: darts.models.TiDEModel
    model_hyper_params:
      input_chunk_length: 24
      output_chunk_length: 12
      output_chunk_shift: 0
      num_encoder_layers: 1
      num_decoder_layers: 1
      decoder_output_dim: 16
      hidden_size: 128
      temporal_width_past: 4
      temporal_width_future: 4
      temporal_hidden_size_past: null
      temporal_hidden_size_future: null
      temporal_decoder_hidden: 32
      use_layer_norm: false
      dropout: 0.1
      use_static_covariates: true
      batch_size: 32
      n_epochs: 100
      learning_rate: 0.001
      random_state: 42
      pl_trainer_kwargs:
        accelerator: cpu
        devices: 1

tuning:
  n_trials: 5
  log_top_k_trial: 3
  metric: rmse
  direction: minimize
  parameters:
    - name: input_chunk_length
      type: categorical
      choices: [24, 48, 96, 192, 336]
    - name: output_chunk_shift
      type: categorical
      choices: [0, 1, 2]
    - name: num_encoder_layers
      type: categorical
      choices: [1, 2, 3]
    - name: num_decoder_layers
      type: categorical
      choices: [1, 2, 3]
    - name: decoder_output_dim
      type: categorical
      choices: [8, 16, 32, 64]
    - name: hidden_size
      type: categorical
      choices: [64, 128, 256, 512]
    - name: temporal_width_past
      type: categorical
      choices: [2, 4, 8, 16]
    - name: temporal_width_future
      type: categorical
      choices: [2, 4, 8, 16]
    - name: temporal_hidden_size_past
      type: categorical
      choices: [null, 16, 32, 64, 128]
    - name: temporal_hidden_size_future
      type: categorical
      choices: [null, 16, 32, 64, 128]
    - name: temporal_decoder_hidden
      type: categorical
      choices: [16, 32, 64, 128]
    - name: use_layer_norm
      type: categorical
      choices: [false, true]
    - name: dropout
      type: float
      min: 0.0
      max: 0.5
    - name: batch_size
      type: categorical
      choices: [16, 32, 64, 128]
    - name: learning_rate
      type: float
      min: 1.0e-6
      max: 1.0e-1
      log: true
    - name: random_state
      type: categorical
      choices: [42, 123, 2024]

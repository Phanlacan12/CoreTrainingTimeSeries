model:
  single_model:
    model_name: darts.models.NLinearModel
    model_hyper_params:
      output_chunk_length: 12
      n_epochs: 100
      normalize: true
      const_init: true
      output_chunk_shift: 0

tuning:
  n_trials: 5
  metric: rmse
  direction: minimize
  parameters:
    - name: input_chunk_length
      type: categorical
      choices: [24, 48, 96, 192, 336]
    - name: learning_rate
      type: float
      min: 1.0e-6
      max: 1.0e-1
      log: true
    - name: batch_size
      type: categorical
      choices: [16, 32, 64, 128, 256]
    - name: shared_weights
      type: categorical
      choices: [false, true]
    - name: use_reversible_instance_norm
      type: categorical
      choices: [false, true]

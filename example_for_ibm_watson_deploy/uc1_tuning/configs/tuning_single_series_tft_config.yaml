model:
  single_model:
    model_name: darts.models.TFTModel
    model_hyper_params:
      add_relative_index: true
      use_static_covariates: true
      full_attention: false
      n_epochs: 100
      output_chunk_length: 12

tuning:
  n_trials: 5
  metric: rmse
  direction: minimize
  parameters:
    - name: hidden_size
      type: categorical
      choices: [16, 32, 64, 128]
    - name: lstm_layers
      type: categorical
      choices: [1, 2, 4]
    - name: num_attention_heads
      type: categorical
      choices: [1, 4, 8]
    - name: dropout
      type: float
      min: 0.0
      max: 0.5
    - name: learning_rate
      type: float
      min: 1.0e-6
      max: 1.0e-1
      log: true
    - name: input_chunk_length
      type: categorical
      choices: [24, 48, 96, 192, 336]

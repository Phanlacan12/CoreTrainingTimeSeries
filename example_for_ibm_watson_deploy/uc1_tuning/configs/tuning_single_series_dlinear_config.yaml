model:
  single_model:
    model_name: darts.models.DLinearModel
    model_hyper_params:
      output_chunk_length: 12
      const_init: true
      n_epochs: 100

tuning:
  n_trials: 5
  metric: rmse
  direction: minimize
  parameters:
    - name: input_chunk_length
      type: categorical
      choices: [24, 48, 96, 192, 336]
    - name: kernel_size
      type: categorical
      choices: [5, 13, 25, 51]
    - name: learning_rate
      type: float
      min: 1.0e-6
      max: 1.0e-1
      log: true
    - name: batch_size
      type: categorical
      choices: [32, 64, 128, 256]
